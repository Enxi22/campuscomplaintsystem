{% extends "student/base.html" %}

{% block title %}Login - Campus Complaints{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-building text-primary" style="font-size: 3rem;"></i>
                    <h2 class="mt-3 fw-bold">Welcome Back</h2>
                    <p class="text-muted">Sign in to your student account</p>
                </div>

                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label required">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="student@campus.edu" required autocomplete="email">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label required">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label text-sm" for="remember">Remember me</label>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </div>
                </form>

                <div class="text-center">
                    <p class="text-muted mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
                    <p class="text-muted mt-2"><a href="{{ url_for('admin_login') }}">Admin Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
