{% extends "admin/base.html" %}

{% block title %}Admin Login - Campus Complaints{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock text-danger" style="font-size: 3rem;"></i>
                    <h2 class="mt-3 fw-bold">Admin Login</h2>
                    <p class="text-muted">Sign in to access the admin dashboard</p>
                </div>

                <form method="POST" novalidate>
                    <div class="mb-3">
                        <label for="email" class="form-label required">Admin Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="admin@campus.edu" required autocomplete="email">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label required">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter admin password" required autocomplete="current-password">
                    </div>

                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="remember" name="remember">
                        <label class="form-check-label text-sm" for="remember">Remember me</label>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-danger btn-lg">
                            <i class="bi bi-shield-check me-2"></i>Sign In
                        </button>
                    </div>
                </form>

                <div class="text-center">
                    <p class="text-muted mb-0"><a href="{{ url_for('login') }}">Student Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
