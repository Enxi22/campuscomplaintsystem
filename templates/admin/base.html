{% extends "base.html" %}

{% block head_extra %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
{% endblock %}

{% block navbar_brand %}
<a class="navbar-brand fw-bold text-danger" href="{{ url_for('admin_dashboard') }}">
    <i class="bi bi-shield-lock me-2"></i>Admin Dashboard
</a>
{% endblock %}

{% block navbar_links %}
<li class="nav-item">
    <a class="nav-link {% if request.endpoint == 'admin_dashboard' %}active{% endif %}" href="{{ url_for('admin_dashboard') }}">
        <i class="bi bi-speedometer2 me-1"></i>Dashboard
    </a>
</li>
<li class="nav-item">
    <a class="nav-link {% if request.endpoint == 'admin_complaints' %}active{% endif %}" href="{{ url_for('admin_complaints') }}">
        <i class="bi bi-list-ul me-1"></i>Complaints
    </a>
</li>
<li class="nav-item">
    <a class="nav-link {% if request.endpoint == 'admin_statistics' %}active{% endif %}" href="{{ url_for('admin_statistics') }}">
        <i class="bi bi-bar-chart me-1"></i>Statistics
    </a>
</li>
{% endblock %}
